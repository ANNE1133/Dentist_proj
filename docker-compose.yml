services:
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: dentist-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
 
  # one-shot job: waits for minio, then creates the bucket the backend expects
  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: dentist-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-dentist-images} &&
      exit 0
      "
  db:
    image: postgres:16-alpine
    container_name: dentistchair-db
    environment:
      POSTGRES_USER: dentist
      POSTGRES_PASSWORD: dentistpass
      POSTGRES_DB: dentistchair
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dentistchair-backend
    depends_on:
      - db
      - python-service
      - minio-init
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: dentist
      DB_PASSWORD: dentistpass
      DB_NAME: dentistchair
      PYTHON_SERVICE_URL: http://python-service:8000
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-dentist-images}
      MINIO_USE_SSL: "false"
    ports:
      - "4000:8080"
    restart: always

  python-service:
    build:
      context: ./backend/python_service

    container_name: dentist-python

    ports:
      - "8000:8000"

    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dentistchair-frontend
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"

volumes:
  pgdata:
  minio-data:
