services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    container_name: dentist-mediamtx
    environment:
      MTX_PATHS_TAPO_SOURCE: ${TAPO_RTSP_URL:-publisher}
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_HOST:-127.0.0.1}
    ports:
      - "8554:8554/tcp" # RTSP
      - "8889:8889/tcp" # WebRTC HTTP/WHEP
      - "8189:8189/udp" # WebRTC media
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

  minio:
    image: pgsty/silo:latest
    container_name: dentist-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
 
  # one-shot job: waits for minio, then creates the bucket the backend expects
  minio-init:
    image: pgsty/mc:latest
    container_name: dentist-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-dentist-images} &&
      exit 0
      "
  db:
    image: postgres:16-alpine
    container_name: dentistchair-db
    environment:
      POSTGRES_USER: dentist
      POSTGRES_PASSWORD: dentistpass
      POSTGRES_DB: dentistchair
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dentistchair-backend
    depends_on:
      - db
      - python-service
      - minio-init
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: dentist
      DB_PASSWORD: dentistpass
      DB_NAME: dentistchair
      PYTHON_SERVICE_URL: http://python-service:8000
      LOGIN_USERNAME: ${LOGIN_USERNAME:-}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:-}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-dentist-images}
      MINIO_USE_SSL: "false"
    ports:
      - "4000:8080"
    restart: always

  python-service:
    build:
      context: ./backend/python_service

    container_name: dentist-python

    ports:
      - "8000:8000"

    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dentistchair-frontend
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
      VITE_TAPO_WEBRTC_URL: ${VITE_TAPO_WEBRTC_URL:-http://localhost:8889/tapo/whep}
    ports:
      - "5173:5173"

volumes:
  pgdata:
  minio-data:
